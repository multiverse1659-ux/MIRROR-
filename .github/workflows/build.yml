name: Build apps

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android-mirror-sender
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug

      - name: Rename output
        run: cp android-mirror-sender/app/build/outputs/apk/debug/app-debug.apk MirrorSender.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MirrorSender-apk
          path: MirrorSender.apk

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: MirrorSender.apk

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: mac-mirror-receiver
        run: xcodegen generate

      - name: Build app
        working-directory: mac-mirror-receiver
        run: |
          xcodebuild -project MacMirror.xcodeproj -scheme MacMirror -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package as .dmg
        working-directory: mac-mirror-receiver
        run: |
          hdiutil create -volname MacMirror -srcfolder build/Build/Products/Release/MacMirror.app \
            -ov -format UDZO ../MacMirror.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: MacMirror-dmg
          path: MacMirror.dmg

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: MacMirror.dmg
